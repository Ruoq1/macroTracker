name: MacroTracker
options:
  bundleIdPrefix: com.ruoqi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  MacroTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MacroTracker
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruoqi.macrotracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "G399Y58H9G"
        CODE_SIGN_STYLE: Automatic
